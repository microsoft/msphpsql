name: Windows performance setup tests

on:
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'test/Performance/setup_env_windows*.ps1'
      - 'buildscripts/php_release.Tests.ps1'
      - 'azure-pipelines.yml'
      - '.github/workflows/windows-performance-setup.yml'
  push:
    branches: [ "dev" ]
    paths:
      - 'test/Performance/setup_env_windows*.ps1'
      - 'buildscripts/php_release.Tests.ps1'
      - 'azure-pipelines.yml'
      - '.github/workflows/windows-performance-setup.yml'

permissions:
  contents: read

jobs:
  setup-tests:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run setup regression tests in 64-bit Windows PowerShell (no provisioning)
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          $result = Invoke-Pester -Script .\test\Performance\setup_env_windows.Tests.ps1, .\buildscripts\php_release.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) {
              throw "Windows setup regression tests failed or did not execute."
          }
      - name: Run setup regression tests in 32-bit Windows PowerShell (no provisioning)
        shell: powershell
        run: |
          $command = @'
          Import-Module Pester -RequiredVersion 3.4.0
          $result = Invoke-Pester -Script .\test\Performance\setup_env_windows.Tests.ps1, .\buildscripts\php_release.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) {
              throw 'Windows setup regression tests failed or did not execute.'
          }
          '@
          & "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command $command
          if ($LASTEXITCODE -ne 0) {
              throw "32-bit Windows PowerShell regression tests failed."
          }
